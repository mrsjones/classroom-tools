<!DOCTYPE html>
<html>
<head>
  <title>Class Agenda</title>
   <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }
    #debug {
      display: none;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div id="debug">Loading...</div>
  <iframe id="slides" src=""></iframe>

  <script>
    const PRESENTATION_ID = "1OpBaUMZwbd2CPJbGkkSwrrWvSPXCnvjDAiVqr92osZ0";

    // Shown before 1st Period, beginning at 8:15am
    const DEFAULT_SLIDE = 7;

    const SCHEDULE = [
	  { name: "Period 1", time: "08:15", slide: 6 },
      { name: "Period 2", time: "09:17", slide: 5 },
      { name: "Period 3", time: "10:09", slide: 4 },
      { name: "Period 4", time: "11:01", slide: 3 },
      { name: "Period 6", time: "13:29", slide: 2 },
      { name: "Period 7", time: "14:21", slide: 1 },
      { name: "Period 8", time: "15:13", slide: 0 },
	  { name: "Down time", time: "16:05", slide: 7 },
    ];

    function log(msg) {
      const el = document.getElementById('debug');
      if (el) el.innerText = msg;
      console.log(msg);
    }

    function getCurrentPeriod() {
      try {
        const now = new Date();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();
        const timeStr = now.toLocaleTimeString();

        let current = { name: "Before School", slide: DEFAULT_SLIDE };
        for (const period of SCHEDULE) {
          const [h, m] = period.time.split(':').map(Number);
          if (currentMinutes >= h * 60 + m) {
            current = period;
          }
        }

        log(`Time: ${timeStr} | Period: ${current.name} | Slide: ${current.slide + 1}`);
        return current;

      } catch(e) {
        log(`ERROR in getCurrentPeriod: ${e.message}`);
        return { name: "Error", slide: DEFAULT_SLIDE };
      }
    }

    let currentSlideNumber = null;

    function updateSlide() {
      try {
        const period = getCurrentPeriod();
        const slideNumber = period.slide + 1;

        // Only reload if the slide has actually changed
        if (slideNumber !== currentSlideNumber) {
          const url = `https://docs.google.com/presentation/d/${PRESENTATION_ID}/embed?slide=${slideNumber}&rm=minimal`;
          document.getElementById('slides').src = url;
          currentSlideNumber = slideNumber;
        }

      } catch(e) {
        log(`ERROR in updateSlide: ${e.message}`);
      }
    }

    setTimeout(updateSlide, 500);
    setInterval(updateSlide, 60000);

    // Request fullscreen automatically on load
    document.addEventListener('click', function enterFullscreen() {
      document.documentElement.requestFullscreen();
      document.removeEventListener('click', enterFullscreen);
    });
  </script>
</body>
</html>
